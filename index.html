<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logitech Receiver WebHID</title><style>body{font-family:system-ui,"Segoe UI",sans-serif;max-width:860px;margin:34px auto;padding:0 18px;line-height:1.65}button{padding:11px 15px;font-size:15px;margin:4px 6px 4px 0;cursor:pointer}.primary{font-weight:700}button:disabled{opacity:.45;cursor:not-allowed}.box,.card{margin:16px 0;padding:13px 15px;background:#fafafa;border-left:4px solid #999}.status{font-size:18px;font-weight:700;margin:14px 0}.ok{border-left-color:#287a3d}.warn{border-left-color:#b06a00}pre{background:#f5f5f5;padding:14px;border-radius:8px;white-space:pre-wrap;min-height:100px}code{background:#eee;padding:1px 4px;border-radius:4px}.small{font-size:13px;color:#555}</style></head><body><h1>Logitech Receiver 配對工具</h1><div class="box">先按「① 選擇／更換接收器」。頁面會依 VID/PID 判斷是否可使用目前的 HID++ 配對方式，不會再對不相容的接收器強制送出指令。</div><div id="env"></div><div id="receiver" class="card"><strong>目前接收器：</strong>尚未選擇</div><div id="compat" class="card">相容性：尚未判斷</div><div id="status" class="status">請先選擇接收器</div><p><button id="select" class="primary">① 選擇／更換接收器</button><button id="pair" class="primary" disabled>② 開始新增裝置</button><button id="stop" disabled>停止配對</button><button id="clear">清除紀錄</button></p><div id="countdown"></div><pre id="out">等待操作…</pre><script>
const VID=0x046D,REPORT_ID=0x10;const INFO=new Map([[0xC52B,{name:'Unifying Receiver (C-U0007)',pair:true}],[0xC532,{name:'Unifying Receiver',pair:true}],[0xC531,{name:'Unifying Receiver',pair:true}],[0xC52F,{name:'Nano Receiver (C-U0010)',pair:true}],[0xC542,{name:'Wireless Receiver',pair:false,reason:'PID C542 不使用目前這套 HID++ Receiver Pairing 寫入方式，因此已停用配對按鈕，避免 NotAllowedError。'}]]);
const out=document.getElementById('out'),statusEl=document.getElementById('status'),countdown=document.getElementById('countdown'),receiverEl=document.getElementById('receiver'),compatEl=document.getElementById('compat'),pairBtn=document.getElementById('pair'),stopBtn=document.getElementById('stop');let dev=null,timer=null,listenerDevice=null;const hex4=n=>n.toString(16).padStart(4,'0').toUpperCase(),h=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(' ');function log(x){const s=typeof x==='string'?x:JSON.stringify(x,null,2);out.textContent=(out.textContent==='等待操作…'?'':out.textContent+'\n')+s}function setStatus(s){statusEl.textContent=s}function info(d){return INFO.get(d.productId)||{name:d.productName||'Logitech HID Device',pair:false,reason:'此 PID 尚未驗證是否支援 HID++ Receiver Pairing；為避免錯誤寫入，暫不開放配對。'}}function show(d){const i=info(d);receiverEl.innerHTML=`<strong>目前接收器：</strong>${i.name}<br><span class="small">瀏覽器名稱：${d.productName||'未提供'} ｜ VID:PID <code>${hex4(d.vendorId)}:${hex4(d.productId)}</code></span>`;compatEl.className='card '+(i.pair?'ok':'warn');compatEl.innerHTML=i.pair?'<strong>相容性：</strong>可嘗試 HID++ 配對。':'<strong>相容性：</strong>目前不可使用此網頁配對。<br>'+i.reason;pairBtn.disabled=!i.pair;stopBtn.disabled=!i.pair}
function onReport(e){const b=Array.from(new Uint8Array(e.data.buffer));log({rxReportId:'0x'+e.reportId.toString(16),data:h(b)});if(e.reportId===0x10&&b.length>=4&&b[1]===0x41&&b[0]!==0xFF){setStatus('偵測到裝置連線，配對可能已成功');stopClock()}}
async function attach(d){if(!d)throw new Error('未選擇接收器');if(!d.opened)await d.open();if(listenerDevice&&listenerDevice!==d)try{listenerDevice.removeEventListener('inputreport',onReport)}catch{};dev=d;if(listenerDevice!==d){d.addEventListener('inputreport',onReport);listenerDevice=d}show(d)}
async function selectReceiver(){try{if(!('hid'in navigator))throw new Error('請使用桌面版 Chrome 或 Edge');const ds=await navigator.hid.requestDevice({filters:[{vendorId:VID}]});if(!ds.length)throw new Error('沒有選擇裝置');await attach(ds[0]);const i=info(dev);setStatus('已選擇：'+i.name);log({selected:i.name,VID:'0x'+hex4(dev.vendorId),PID:'0x'+hex4(dev.productId),HIDPP_pairing:i.pair});if(!i.pair)log(i.reason)}catch(e){setStatus('選擇接收器失敗');log('錯誤：'+(e?.message||e))}}
async function sendPairing(open,timeout=30){if(!dev||!info(dev).pair)throw new Error('此接收器未開放 HID++ 配對');const payload=new Uint8Array([0xFF,0x80,0xB2,open?1:2,0,open?timeout:0]);log('TX report 0x10: '+h(payload));await dev.sendReport(REPORT_ID,payload)}function stopClock(){if(timer){clearInterval(timer);timer=null}}function startClock(){stopClock();let r=30;countdown.textContent='剩餘約 30 秒';timer=setInterval(()=>{r--;countdown.textContent=r>0?'剩餘約 '+r+' 秒':'配對時間結束';if(r<=0)stopClock()},1000)}async function startPair(){try{await sendPairing(true,30);startClock();setStatus('已開啟配對模式：現在將裝置關閉約 2 秒再開啟')}catch(e){setStatus('配對啟動失敗');log('錯誤：'+(e?.message||e))}}async function stopPair(){try{await sendPairing(false,0);stopClock();countdown.textContent='';setStatus('已停止配對模式')}catch(e){log('停止失敗：'+(e?.message||e))}}
document.getElementById('select').onclick=selectReceiver;pairBtn.onclick=startPair;stopBtn.onclick=stopPair;document.getElementById('clear').onclick=()=>out.textContent='等待操作…';const supported='hid'in navigator;document.getElementById('env').textContent='WebHID：'+(supported?'SUPPORTED':'NOT SUPPORTED');if(supported)navigator.hid.addEventListener('disconnect',e=>{if(dev===e.device){dev=null;pairBtn.disabled=true;stopBtn.disabled=true;receiverEl.innerHTML='<strong>目前接收器：</strong>已拔除';compatEl.textContent='相容性：尚未判斷';setStatus('Receiver 已拔除');stopClock()}});
</script></body></html>
