<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logitech C-U0010 / C52F M331 配對</title>
  <style>
    body{font-family:system-ui,"Segoe UI",sans-serif;max-width:860px;margin:34px auto;padding:0 18px;line-height:1.65}
    h1{font-size:28px} button{padding:11px 15px;font-size:15px;cursor:pointer;margin:4px 6px 4px 0}
    button.primary{font-weight:700} button:disabled{opacity:.5;cursor:not-allowed}
    .box{margin:16px 0;padding:13px 15px;background:#fafafa;border-left:4px solid #999}
    .status{font-size:18px;font-weight:700;margin:14px 0}.ok{font-weight:700}.warn{font-weight:700}
    pre{background:#f5f5f5;padding:14px;border-radius:8px;overflow:auto;white-space:pre-wrap;min-height:120px}
    code{background:#f3f3f3;padding:1px 4px;border-radius:4px}
  </style>
</head>
<body>
  <h1>Logitech C-U0010 / C52F 配對 M331</h1>
  <p>此頁會透過 WebHID 對 <code>046D:C52F</code> Nano Receiver 送出 HID++ 1.0 的 Receiver Pairing 指令，讓接收器進入約 30 秒配對模式。</p>

  <div class="box">
    <strong>使用方式</strong><br>
    1. 插入 C-U0010。<br>
    2. 先把 M331 關閉。<br>
    3. 按「開始配對 M331」。<br>
    4. 畫面顯示已進入配對模式後，把 M331 開啟並靠近接收器。<br>
    5. 等待滑鼠開始移動游標或畫面顯示偵測到新連線。
  </div>

  <div id="env"></div>
  <div class="status" id="status">尚未開始</div>
  <p>
    <button id="pair" class="primary">開始配對 M331</button>
    <button id="stop">停止配對</button>
    <button id="select">重新選擇 C52F</button>
    <button id="clear">清除紀錄</button>
  </p>
  <div id="countdown"></div>
  <pre id="out">等待操作…</pre>

<script>
const VID=0x046D, PID=0xC52F, REPORT_ID=0x10;
const out=document.getElementById('out'), statusEl=document.getElementById('status'), countdown=document.getElementById('countdown');
let dev=null, timer=null, remain=0, pairing=false, listenerAttached=false;
const h=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(' ');
function log(x){const s=typeof x==='string'?x:JSON.stringify(x,null,2);out.textContent=(out.textContent==='等待操作…'?'':out.textContent+'\n')+s;out.scrollTop=out.scrollHeight}
function setStatus(s){statusEl.textContent=s}
function target(d){return d.vendorId===VID&&d.productId===PID}
function vendorSpecific(d){return (d.collections||[]).some(c=>c.usagePage===0xFF00)}
function hasOutput10(d){return (d.collections||[]).some(c=>((c.outputReports||[]).some(r=>r.reportId===REPORT_ID))||((c.children||[]).some(ch=>(ch.outputReports||[]).some(r=>r.reportId===REPORT_ID))))}
function choose(ds){const t=ds.filter(target);return t.find(d=>vendorSpecific(d)&&hasOutput10(d))||t.find(d=>vendorSpecific(d))||t[0]||null}
async function attach(d){if(!d)throw new Error('找不到 046D:C52F。');if(!d.opened)await d.open();dev=d;if(!listenerAttached){dev.addEventListener('inputreport',onReport);listenerAttached=true}return d}
function onReport(e){const b=Array.from(new Uint8Array(e.data.buffer));log({rxReportId:'0x'+e.reportId.toString(16),data:h(b)});
  // WebHID data excludes report ID. HID++ short packet starts with device number.
  if(e.reportId===0x10&&b.length>=4){
    const devnum=b[0], sub=b[1], addr=b[2];
    if(sub===0x8F&&b.length>=5){const err=b[4]; if(b[2]===0x80&&b[3]===0xB2){setStatus('接收器拒絕配對指令，錯誤碼 0x'+err.toString(16));}}
    if(sub===0x41&&devnum!==0xFF){setStatus('偵測到裝置連線，配對可能已成功'); pairing=false; stopClock();}
    if(devnum===0xFF&&sub===0x80&&addr===0xB2){log('Receiver 已回覆 Pairing Register 指令。');}
  }
}
async function getDevice(interactive=false){
  let ds=await navigator.hid.getDevices();let d=choose(ds);
  if(!d&&interactive){ds=await navigator.hid.requestDevice({filters:[{vendorId:VID,productId:PID}]});d=choose(ds)}
  return d;
}
async function sendPairing(open,timeout=30){
  // Solaar/HID++ 1.0: receiver devnumber FF, write register B2 => request 80B2.
  // Open lock: action 01, device 00, timeout seconds. Close lock: action 02.
  const payload=new Uint8Array([0xFF,0x80,0xB2,open?0x01:0x02,0x00,open?timeout:0x00]);
  log('TX report 0x10: '+h(payload));
  await dev.sendReport(REPORT_ID,payload);
}
function startClock(){stopClock();remain=30;countdown.textContent='剩餘約 30 秒';timer=setInterval(()=>{remain--;countdown.textContent=remain>0?'剩餘約 '+remain+' 秒':'配對時間結束';if(remain<=0){stopClock();pairing=false}},1000)}
function stopClock(){if(timer){clearInterval(timer);timer=null}}
async function startPair(){
  try{
    if(!('hid' in navigator))throw new Error('此瀏覽器不支援 WebHID，請使用桌面版 Chrome 或 Edge。');
    setStatus('正在連線 C52F…');
    let d=await getDevice(false);if(!d)d=await getDevice(true);await attach(d);
    log({device:d.productName,vendorId:'046d',productId:'c52f',vendorSpecific:vendorSpecific(d),outputReport10:hasOutput10(d)});
    setStatus('正在開啟 Receiver 配對模式…');
    await sendPairing(true,30);
    pairing=true;startClock();
    setStatus('已送出配對指令：現在把 M331 關閉再開啟');
    log('請現在把 M331 關閉約 2 秒後再開啟，並放在 C-U0010 附近。');
  }catch(e){setStatus('配對啟動失敗');log('錯誤：'+(e?.stack||e));}
}
async function stopPair(){try{if(!dev){const d=await getDevice(false);if(d)await attach(d)}if(dev)await sendPairing(false,0);pairing=false;stopClock();countdown.textContent='';setStatus('已停止配對模式')}catch(e){log('停止配對失敗：'+(e?.stack||e))}}
document.getElementById('pair').addEventListener('click',startPair);
document.getElementById('stop').addEventListener('click',stopPair);
document.getElementById('select').addEventListener('click',async()=>{try{const ds=await navigator.hid.requestDevice({filters:[{vendorId:VID,productId:PID}]});dev=choose(ds);listenerAttached=false;await attach(dev);setStatus('已選取 C52F');log('已重新選取 '+dev.productName)}catch(e){log('選取失敗：'+(e?.stack||e))}});
document.getElementById('clear').addEventListener('click',()=>out.textContent='等待操作…');
const supported='hid' in navigator;
document.getElementById('env').innerHTML=`Secure Context：<span class="${window.isSecureContext?'ok':'warn'}">${window.isSecureContext?'YES':'NO'}</span>　WebHID：<span class="${supported?'ok':'warn'}">${supported?'SUPPORTED':'NOT SUPPORTED'}</span>`;
if(supported){navigator.hid.addEventListener('disconnect',e=>{if(dev&&e.device===dev){setStatus('Receiver 已拔除');dev=null;listenerAttached=false;stopClock()}})}
</script>
</body>
</html>
