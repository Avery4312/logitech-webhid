<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Logitech C-U0010 WebHID 診斷</title>
  <style>
    body { font-family: system-ui, "Segoe UI", sans-serif; max-width: 900px; margin: 36px auto; padding: 0 18px; line-height: 1.6; }
    button { padding: 10px 14px; font-size: 15px; cursor: pointer; margin: 4px 6px 4px 0; }
    pre { background: #f5f5f5; padding: 14px; border-radius: 8px; overflow: auto; white-space: pre-wrap; }
    .note { margin: 16px 0; padding: 12px 14px; background: #fafafa; border-left: 4px solid #999; }
    .ok { font-weight: 700; }
    .warn { font-weight: 700; }
  </style>
</head>
<body>
  <h1>Logitech C-U0010 / C52F WebHID 診斷</h1>
  <p>此版本用來確認瀏覽器是否能真正開啟 Logitech USB Receiver 的 HID 介面並讀取描述資訊。它<strong>不會送出配對指令，也不會修改接收器</strong>。</p>

  <div class="note">
    目標裝置：Logitech USB Receiver，VID <code>046D</code>，PID <code>C52F</code>。<br>
    建議使用桌面版 Chrome 或 Edge，並直接從 GitHub Pages 的 HTTPS 網址開啟。
  </div>

  <div id="env"></div>
  <p>
    <button id="authorized">查看已授權裝置</button>
    <button id="select">選擇 C52F Receiver</button>
    <button id="open">開啟選取裝置</button>
    <button id="clear">清除紀錄</button>
  </p>

  <pre id="out">等待操作…</pre>

  <script>
    const out = document.getElementById('out');
    const env = document.getElementById('env');
    let selected = null;

    const hex = (n, width = 4) => '0x' + Number(n).toString(16).padStart(width, '0');

    function append(msg) {
      const t = typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2);
      out.textContent = (out.textContent === '等待操作…' ? '' : out.textContent + '\n') + t;
    }

    function reportIds(list) {
      return (list || []).map(r => ({ reportId: r.reportId, items: (r.items || []).length }));
    }

    function describeCollection(c) {
      return {
        usagePage: hex(c.usagePage),
        usage: hex(c.usage),
        type: c.type,
        inputReports: reportIds(c.inputReports),
        outputReports: reportIds(c.outputReports),
        featureReports: reportIds(c.featureReports),
        children: (c.children || []).map(describeCollection)
      };
    }

    function describeDevice(d) {
      return {
        productName: d.productName || '(無名稱)',
        vendorId: hex(d.vendorId),
        productId: hex(d.productId),
        opened: d.opened,
        collections: (d.collections || []).map(describeCollection)
      };
    }

    function isTarget(d) {
      return d.vendorId === 0x046D && d.productId === 0xC52F;
    }

    async function ensureOpen(d) {
      if (!d) throw new Error('尚未選擇裝置。');
      if (!d.opened) await d.open();
      d.addEventListener('inputreport', e => {
        const bytes = Array.from(new Uint8Array(e.data.buffer));
        append({
          event: 'inputreport',
          reportId: e.reportId,
          dataHex: bytes.map(b => b.toString(16).padStart(2, '0')).join(' ')
        });
      });
      return d;
    }

    function showEnvironment() {
      const hidSupported = 'hid' in navigator;
      env.innerHTML = `
        <p>Secure Context：<span class="${window.isSecureContext ? 'ok' : 'warn'}">${window.isSecureContext ? 'YES' : 'NO'}</span><br>
        WebHID：<span class="${hidSupported ? 'ok' : 'warn'}">${hidSupported ? 'SUPPORTED' : 'NOT SUPPORTED'}</span></p>`;
    }

    document.getElementById('authorized').addEventListener('click', async () => {
      if (!('hid' in navigator)) return append('此瀏覽器不支援 WebHID。');
      try {
        const devices = await navigator.hid.getDevices();
        const logi = devices.filter(d => d.vendorId === 0x046D);
        append({ action: 'getDevices', count: logi.length, devices: logi.map(describeDevice) });
        const target = logi.find(isTarget);
        if (target) {
          selected = target;
          append('已找到並選取 046D:C52F。');
        }
      } catch (e) {
        append('錯誤：' + (e?.stack || e));
      }
    });

    document.getElementById('select').addEventListener('click', async () => {
      if (!('hid' in navigator)) return append('此瀏覽器不支援 WebHID。');
      try {
        const devices = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x046D, productId: 0xC52F }] });
        if (!devices.length) return append('沒有選到 C52F Receiver。');
        selected = devices[0];
        append({ action: 'selected', device: describeDevice(selected) });
      } catch (e) {
        append('錯誤：' + (e?.stack || e));
      }
    });

    document.getElementById('open').addEventListener('click', async () => {
      try {
        if (!selected) {
          const devices = await navigator.hid.getDevices();
          selected = devices.find(isTarget) || null;
        }
        await ensureOpen(selected);
        append({ action: 'opened', device: describeDevice(selected) });
        append('C52F 已成功由瀏覽器開啟。現在可安全進一步分析 HID++，但此頁尚未送出任何配對命令。');
      } catch (e) {
        append('開啟失敗：' + (e?.stack || e));
      }
    });

    document.getElementById('clear').addEventListener('click', () => {
      out.textContent = '等待操作…';
    });

    if ('hid' in navigator) {
      navigator.hid.addEventListener('connect', e => append({ event: 'connect', device: describeDevice(e.device) }));
      navigator.hid.addEventListener('disconnect', e => append({ event: 'disconnect', device: describeDevice(e.device) }));
    }

    showEnvironment();
  </script>
</body>
</html>
