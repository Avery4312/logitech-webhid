<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logitech Receiver WebHID 配對</title><style>body{font-family:system-ui,"Segoe UI",sans-serif;max-width:860px;margin:34px auto;padding:0 18px;line-height:1.65}h1{font-size:28px}button{padding:11px 15px;font-size:15px;cursor:pointer;margin:4px 6px 4px 0}.primary{font-weight:700}.box,.card{margin:16px 0;padding:13px 15px;background:#fafafa;border-left:4px solid #999}.card{border-left-color:#333}.status{font-size:18px;font-weight:700;margin:14px 0}pre{background:#f5f5f5;padding:14px;border-radius:8px;overflow:auto;white-space:pre-wrap;min-height:120px}code{background:#f3f3f3;padding:1px 4px;border-radius:4px}.small{font-size:13px;color:#555}</style></head><body>
<h1>Logitech Receiver 配對</h1>
<div class="box"><strong>流程</strong><br>① 插入接收器 → ② 按「選擇接收器」→ ③ 在 Chrome / Edge 視窗選擇 <strong>Unifying Receiver</strong> 或 <strong>Wireless Receiver</strong> → ④ 確認下方 VID/PID → ⑤ 開始新增裝置。</div>
<div id="env"></div><div class="card" id="receiver"><strong>目前接收器：</strong>尚未選擇</div><div class="status" id="status">請先選擇接收器</div>
<p><button id="select" class="primary">① 選擇／更換接收器</button><button id="pair" class="primary">② 開始新增裝置</button><button id="stop">停止配對</button><button id="clear">清除紀錄</button></p><div id="countdown"></div><pre id="out">等待操作…</pre>
<script>
const VID=0x046D,REPORT_ID=0x10;
const KNOWN=new Map([[0xC52B,'Unifying Receiver (C-U0007)'],[0xC532,'Unifying Receiver'],[0xC531,'Unifying Receiver'],[0xC52F,'Wireless / Nano Receiver (C-U0010)']]);
const out=document.getElementById('out'),statusEl=document.getElementById('status'),countdown=document.getElementById('countdown'),receiverEl=document.getElementById('receiver');let dev=null,timer=null,listenerDevice=null;
const hex4=n=>n.toString(16).padStart(4,'0').toUpperCase(),h=b=>Array.from(b).map(x=>x.toString(16).padStart(2,'0')).join(' ');function log(x){const s=typeof x==='string'?x:JSON.stringify(x,null,2);out.textContent=(out.textContent==='等待操作…'?'':out.textContent+'\n')+s;out.scrollTop=out.scrollHeight}function setStatus(s){statusEl.textContent=s}
function label(d){const known=KNOWN.get(d.productId);if(known)return known;const p=(d.productName||'').trim();if(/unifying/i.test(p))return 'Unifying Receiver';if(/wireless|receiver/i.test(p))return 'Wireless Receiver';return p||'Logitech HID Device'}
function show(d){receiverEl.innerHTML=`<strong>目前接收器：</strong>${label(d)}<br><span class="small">瀏覽器名稱：${d.productName||'未提供'}　｜　VID:PID <code>${hex4(d.vendorId)}:${hex4(d.productId)}</code></span>`}
function onReport(e){const b=Array.from(new Uint8Array(e.data.buffer));log({rxReportId:'0x'+e.reportId.toString(16),data:h(b)});if(e.reportId===0x10&&b.length>=4){if(b[1]===0x41&&b[0]!==0xFF){setStatus('偵測到裝置連線，配對可能已成功');stopClock()}if(b[1]===0x8F&&b.length>=5&&b[2]===0x80&&b[3]===0xB2)setStatus('接收器拒絕配對指令，錯誤碼 0x'+b[4].toString(16))}}
async function attach(d){if(!d)throw new Error('未選擇接收器');if(!d.opened)await d.open();if(listenerDevice&&listenerDevice!==d)try{listenerDevice.removeEventListener('inputreport',onReport)}catch{};dev=d;if(listenerDevice!==d){d.addEventListener('inputreport',onReport);listenerDevice=d}show(d)}
async function selectReceiver(){try{if(!('hid'in navigator))throw new Error('請使用桌面版 Chrome 或 Edge');setStatus('請在瀏覽器視窗選擇接收器…');const ds=await navigator.hid.requestDevice({filters:[{vendorId:VID}]});if(!ds.length)throw new Error('沒有選擇裝置');const d=ds[0];await attach(d);setStatus('已選擇：'+label(d));log({selected:label(d),browserName:d.productName||null,VID:'0x'+hex4(d.vendorId),PID:'0x'+hex4(d.productId)});if(!KNOWN.has(d.productId))log('此接收器 PID 尚未建檔。請把上方 PID 提供給我，我可以加入專用辨識。')}catch(e){setStatus('選擇接收器失敗');log('錯誤：'+(e?.message||e))}}
async function sendPairing(open,timeout=30){const payload=new Uint8Array([0xFF,0x80,0xB2,open?1:2,0,open?timeout:0]);log('TX report 0x10: '+h(payload));await dev.sendReport(REPORT_ID,payload)}function stopClock(){if(timer){clearInterval(timer);timer=null}}function startClock(){stopClock();let r=30;countdown.textContent='剩餘約 30 秒';timer=setInterval(()=>{r--;countdown.textContent=r>0?'剩餘約 '+r+' 秒':'配對時間結束';if(r<=0)stopClock()},1000)}
async function startPair(){try{if(!dev)throw new Error('請先選擇接收器');setStatus('正在開啟 '+label(dev)+' 配對模式…');await sendPairing(true,30);startClock();setStatus('已送出配對指令：現在將要新增的裝置關閉約 2 秒再開啟')}catch(e){setStatus('配對啟動失敗');log('錯誤：'+(e?.stack||e))}}async function stopPair(){try{if(dev)await sendPairing(false,0);stopClock();countdown.textContent='';setStatus('已停止配對模式')}catch(e){log('停止失敗：'+(e?.stack||e))}}
document.getElementById('select').onclick=selectReceiver;document.getElementById('pair').onclick=startPair;document.getElementById('stop').onclick=stopPair;document.getElementById('clear').onclick=()=>out.textContent='等待操作…';const supported='hid'in navigator;document.getElementById('env').textContent='WebHID：'+(supported?'SUPPORTED':'NOT SUPPORTED');if(supported)navigator.hid.addEventListener('disconnect',e=>{if(dev===e.device){dev=null;receiverEl.innerHTML='<strong>目前接收器：</strong>已拔除';setStatus('Receiver 已拔除');stopClock()}});
</script></body></html>
